# Video to Image
FRAMES_PER_VIDEO: 128
IMAGE_SIZE: 224

# Augmentation
augmentation:
  resize_crop_scale: [0.9, 1.0]
  horizontal_flip_p: 0.5
  color_jitter: [0.1, 0.1, 0.1, 0.0] # (brightness, contrast, saturation, hue)
  gaussian_blur_sigma: [0.1, 1.0]
  N: 5 # N time augmentation

videoEncoding:
  FRAMES_BATCH: 32

BATCH_SIZE: 4
MAX_WORKERS: 2
SEED: 42
DEVICE: cpu
